[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-project"
version = "0.1.0"
description = "Source-grounded AI news drafting and Android X posting"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
x-project = "x_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
